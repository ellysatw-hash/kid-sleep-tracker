<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家人作息大挑戰</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #f0f2f5; --success: #00b894; --accent: #fd79a8; --danger: #ff7675; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 420px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .input-group { text-align: left; margin-bottom: 12px; }
        label { font-weight: bold; font-size: 0.9rem; color: #636e72; }
        select, input[type="time"] { width: 100%; padding: 10px; margin-top: 5px; border-radius: 10px; border: 2px solid var(--primary); background: #f0edff; font-size: 1rem; }
        .subject-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; background: #fafafa; padding: 10px; border-radius: 10px; border: 1px solid #eee; }
        .subject-item { display: flex; align-items: center; font-size: 0.85rem; cursor: pointer; }
        #result-display { background: #f9f9ff; border-left: 5px solid var(--primary); padding: 12px; margin: 15px 0; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .btn-plan { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; flex: 1; cursor: pointer; min-width: 100%; }
        .btn-finish { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; flex: 2; cursor: pointer; display: none; }
        .btn-cancel { background: var(--danger); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; flex: 1; cursor: pointer; display: none; font-size: 0.8rem; }
        
        .chart-section { width: 100%; max-width: 420px; margin-top: 20px; background: white; padding: 15px; border-radius: 20px; text-align: center; }
        .history-list { text-align: left; margin-top: 10px; padding: 0; list-style: none; }
        .history-item { background: #f8f9fa; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 0.85rem; display: flex; justify-content: space-between; border-left: 3px solid var(--success); }
        .history-date { color: #636e72; font-weight: bold; }
        .history-time { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color:var(--primary); text-align:center; margin:0 0 15px 0;">🏡 家人作息大挑戰</h1>
    
    <div class="input-group">
        <label>挑戰成員：</label>
        <select id="childName" onchange="runUpdateChart()">
            <option value="小佑">👦 小佑</option>
            <option value="媽媽">👧 媽媽</option>
        </select>
    </div>

    <div class="input-group">
        <label>目標就寢時間</label>
        <input type="time" id="bedtime" value="21:30" oninput="runCalculate()">
    </div>

    <div class="input-group">
        <label>今日規劃項目：</label>
        <div class="subject-grid" id="subjectGrid">
            <label class="subject-item"><input type="checkbox" value="國語" onchange="runCalculate()">國語</label>
            <label class="subject-item"><input type="checkbox" value="數學" onchange="runCalculate()">數學</label>
            <label class="subject-item"><input type="checkbox" value="英文" onchange="runCalculate()">英文</label>
            <label class="subject-item"><input type="checkbox" value="地理" onchange="runCalculate()">地理</label>
            <label class="subject-item"><input type="checkbox" value="歷史" onchange="runCalculate()">歷史</label>
            <label class="subject-item"><input type="checkbox" value="公民" onchange="runCalculate()">公民</label>
            <label class="subject-item"><input type="checkbox" value="物理" onchange="runCalculate()">物理</label>
            <label class="subject-item"><input type="checkbox" value="化學" onchange="runCalculate()">化學</label>
            <label class="subject-item"><input type="checkbox" value="運動" onchange="runCalculate()">運動</label>
            <label class="subject-item"><input type="checkbox" value="其他" onchange="runCalculate()">其他</label>
        </div>
    </div>

    <div id="result-display">請填寫規劃...</div>

    <div class="btn-group">
        <button id="btnPlan" class="btn-plan" onclick="savePlan()">📝 鎖定今晚計畫</button>
        <button id="btnFinish" class="btn-finish" onclick="completePlan()">🎉 我完成了！</button>
        <button id="btnCancel" class="btn-cancel" onclick="cancelPlan()">✖ 取消計畫</button>
    </div>
</div>

<div class="chart-section">
    <h3>📋 最近完成紀錄</h3>
    <ul id="historyList" class="history-list"></ul>
</div>

<div class="chart-section"><canvas id="myChart" height="150"></canvas></div>
<div class="chart-section"><canvas id="pieChart"></canvas></div>

<script>
    const MY_URL = 'https://jcclynwwvcnjnjcorlqr.supabase.co'; 
    const MY_KEY = 'sb_publishable_hCm34wTgpGWyJkWKNApTEw_4Xu_f1Vq';
    let db;
    try { db = window.supabase.createClient(MY_URL, MY_KEY); } catch (e) { console.error(e); }

    let currentPlanId = null;

    window.onload = () => { 
        runCalculate(); 
        checkActivePlan(); 
        setTimeout(runUpdateChart, 500); 
    };

    function checkActivePlan() {
        const savedId = localStorage.getItem('activePlanId');
        const savedName = localStorage.getItem('activePlanName');
        if (savedId) {
            currentPlanId = savedId;
            if (savedName) document.getElementById('childName').value = savedName;
            document.getElementById('btnPlan').style.display = 'none';
            document.getElementById('btnFinish').style.display = 'block';
            document.getElementById('btnCancel').style.display = 'block';
            document.getElementById('result-display').innerHTML = "⚠️ 計畫進行中，加油！";
        }
    }

    function getChecked() { return Array.from(document.querySelectorAll('#subjectGrid input:checked')).map(cb => cb.value); }

    function runCalculate() {
        const timeVal = document.getElementById('bedtime').value;
        const subs = getChecked();
        const res = document.getElementById('result-display');
        if (!timeVal) return;
        const now = new Date();
        const [h, m] = timeVal.split(':');
        const target = new Date(); target.setHours(h, m, 0);
        if (target < now) target.setDate(target.getDate() + 1);
        let diff = Math.floor((target - now) / 60000);
        const buffer = Math.max(0, Math.floor((diff - 30) * 0.15));
        const study = Math.max(0, diff - 30 - buffer);
        const per = subs.length > 0 ? Math.floor(study / subs.length) : 0;
        res.innerHTML = `🕒 剩餘時間：${diff}分<br>🛡️ 緩衝時間：${buffer}分<br>📊 任務分配建議：${per} 分鐘/項`;
    }

    async function savePlan() {
        const subs = getChecked();
        if (subs.length === 0) return alert("請先勾選規劃項目！");
        const subjectsString = subs.join(',');
        const childName = document.getElementById('childName').value;

        const { data, error } = await db.from('daily_plans').insert([{ 
            child_name: childName, 
            bedtime: document.getElementById('bedtime').value, 
            subjects: subjectsString,
            checked_subjects: subjectsString, 
            status: 'planning'
        }]).select();

        if (error) alert("鎖定失敗：" + error.message);
        else {
            currentPlanId = data[0].id;
            localStorage.setItem('activePlanId', currentPlanId);
            localStorage.setItem('activePlanName', childName);
            
            document.getElementById('btnPlan').style.display = 'none';
            document.getElementById('btnFinish').style.display = 'block';
            document.getElementById('btnCancel').style.display = 'block';
            document.getElementById('result-display').innerHTML = "📝 計畫已鎖定！";
        }
    }

    async function cancelPlan() {
        if (!currentPlanId) return;
        if (!confirm("確定要取消目前的計畫並重來嗎？")) return;

        // 從資料庫刪除該筆未完成紀錄
        const { error } = await db.from('daily_plans').delete().eq('id', currentPlanId);

        if (error) {
            alert("取消失敗：" + error.message);
        } else {
            localStorage.removeItem('activePlanId');
            localStorage.removeItem('activePlanName');
            alert("計畫已取消，請重新規劃。");
            resetUI();
            runCalculate();
        }
    }

    async function completePlan() {
        if (!currentPlanId) return;
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        const now = new Date();
        const fTime = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');

        const { error } = await db.from('daily_plans').update({ 
            actual_finish_time: fTime,
            status: 'completed'
        }).eq('id', currentPlanId);

        if (error) alert(error.message);
        else {
            alert("挑戰達成！");
            localStorage.removeItem('activePlanId');
            localStorage.removeItem('activePlanName');
            resetUI();
            runUpdateChart();
        }
    }

    function resetUI() {
        document.getElementById('btnPlan').style.display = 'block';
        document.getElementById('btnFinish').style.display = 'none';
        document.getElementById('btnCancel').style.display = 'none';
        document.getElementById('result-display').innerHTML = "請填寫規劃...";
        currentPlanId = null;
    }

    let c1, c2;
    async function runUpdateChart() {
        if (!db) return;
        const name = document.getElementById('childName').value;
        const { data } = await db.from('daily_plans').select('*').eq('child_name', name).eq('status','completed').order('created_at', { ascending: false }).limit(20);
        
        const listEl = document.getElementById('historyList');
        listEl.innerHTML = "";
        if (data) {
            data.slice(0, 5).forEach(item => {
                const date = new Date(item.created_at);
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `<span class="history-date">📅 ${date.getMonth()+1}/${date.getDate()}</span> 
                                <span>${item.checked_subjects ? item.checked_subjects.split(',').length : 0} 項</span>
                                <span class="history-time">⏰ ${item.actual_finish_time}</span>`;
                listEl.appendChild(li);
            });
        }

        if (!data || data.length === 0) return;
        const rev = [...data].reverse();
        if (c1) c1.destroy();
        c1 = new Chart(document.getElementById('myChart'), {
            type: 'bar',
            data: { labels: rev.map(d => (new Date(d.created_at).getMonth()+1)+"/"+new Date(d.created_at).getDate()), datasets: [{ label: '已完成', data: rev.map(()=>1), backgroundColor: '#a29bfe' }] },
            options: { scales: { y: { max: 1, ticks: { stepSize: 1 } } } }
        });
        const counts = {};
        data.forEach(r => { if(r.checked_subjects) r.checked_subjects.split(',').forEach(s => counts[s] = (counts[s]||0)+1); });
        if (c2) c2.destroy();
        c2 = new Chart(document.getElementById('pieChart'), {
            type: 'doughnut',
            data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: ['#fd79a8','#fab1a0','#ffeaa7','#55efc4','#81ecec','#74b9ff','#a29bfe'] }] }
        });
    }
</script>
</body>
</html>
