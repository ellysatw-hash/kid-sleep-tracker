<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小當家作戰總部</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; color: #636e72; }
        input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 1px solid #dfe6e9; box-sizing: border-box; }
        #result-display { background: #f9f9ff; border-left: 5px solid var(--primary); padding: 15px; margin: 20px 0; border-radius: 8px; min-height: 60px; line-height: 1.5; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌙 睡前大挑戰</h1>
    <div class="input-group">
        <label>目標就寢時間</label>
        <input type="time" id="bedtime" value="21:30" oninput="safeCalculate()">
    </div>
    <div class="input-group">
        <label>今晚複習科目</label>
        <input type="text" id="subjects" placeholder="例如：數學、英文" oninput="safeCalculate()">
    </div>
    <div id="result-display">請輸入時間...</div>
    <button onclick="safeFinish()">我準時完成了！ 🎉</button>
</div>

<div style="width: 100%; max-width: 450px; margin-top: 20px; background: white; padding: 20px; border-radius: 20px;">
    <canvas id="myChart"></canvas>
</div>

<script>
    // --- 配置區 ---
    const S_URL = 'https://jcclynwwvcnjnjcorlqr.supabase.co'; // 例如 https://xyz.supabase.co
    const S_KEY = 'sb_publishable_hCm34wTgpGWyJkWKNApTEw_4Xu_f1Vq';

    let supabaseClient = null;

    // 防止 Supabase 初始化失敗導致整個程式壞掉
    try {
        if (S_URL.startsWith('http')) {
            supabaseClient = supabase.createClient(S_URL, S_KEY);
        }
    } catch (e) { console.error("資料庫連線設定有誤"); }

    // 安全的計算函式
    function safeCalculate() {
        const bedtimeInput = document.getElementById('bedtime').value;
        const subjectsInput = document.getElementById('subjects').value;
        const displayDiv = document.getElementById('result-display');

        const now = new Date();
        const [h, m] = bedtimeInput.split(':');
        let target = new Date();
        target.setHours(h, m, 0);
        if (target < now) target.setDate(target.getDate() + 1);

        let diff = Math.floor((target - now) / 60000);
        let available = diff - 30; 
        let buffer = Math.max(0, Math.floor(available * 0.15));
        let study = Math.max(0, available - buffer);
        
        let subs = subjectsInput.split(/[,，、\s]+/).filter(s => s.trim() !== "");
        let perSub = Math.floor(study / (subs.length || 1));

        displayDiv.innerHTML = `🕒 距離就寢：${diff} 分鐘<br>🛡️ 緩衝時間：${buffer} 分鐘<br>📚 每個科目可讀：${perSub} 分鐘`;
    }

    // 安全的完成函式
    async function safeFinish() {
        // 1. 先噴紙屑 (這不依賴資料庫)
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

        // 2. 嘗試存檔
        if (!supabaseClient) {
            alert("網頁已噴紙屑！但資料庫連線尚未設定正確，無法記錄喔。");
            return;
        }

        const { error } = await supabaseClient.from('daily_plans').insert([
            { 
                bedtime: document.getElementById('bedtime').value, 
                subjects: document.getElementById('subjects').value, 
                is_on_time: true 
            }
        ]);

        if (error) {
            console.error(error);
            alert("存檔失敗：" + error.message);
        } else {
            alert("太棒了！紀錄已儲存");
            if (typeof updateChart === 'function') updateChart();
        }
    }

    // 圖表功能
    async function updateChart() {
        if (!supabaseClient) return;
        const { data } = await supabaseClient.from('daily_plans').select('*').order('created_at', { ascending: true }).limit(30);
        if (!data) return;

        const ctx = document.getElementById('myChart').getContext('2d');
        if (window.chartObj) window.chartObj.destroy();
        window.chartObj = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.map(d => new Date(d.created_at).getDate() + "日"),
                datasets: [{ label: '達成', data: data.map(d => 1), backgroundColor: '#a29bfe' }]
            },
            options: { scales: { y: { max: 1, beginAtZero: true } } }
        });
    }

    // 啟動
    window.onload = () => {
        safeCalculate();
        updateChart();
    };
</script>
</body>
</html>
