<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小當家作戰總部-多子版</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #f0f2f5; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .input-group { text-align: left; margin-bottom: 12px; }
        label { font-weight: bold; font-size: 0.9rem; color: #636e72; }
        /* 這裡特別把下拉選單加顏色，方便辨認 */
        select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 2px solid var(--primary); background-color: #f0edff; font-size: 1.1rem; }
        input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 1px solid #dfe6e9; box-sizing: border-box; font-size: 1rem; }
        #result-display { background: #f9f9ff; border-left: 5px solid var(--primary); padding: 15px; margin: 15px 0; border-radius: 8px; font-size: 0.95rem; min-height: 60px; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .chart-section { width: 100%; max-width: 450px; margin-top: 20px; background: white; padding: 20px; border-radius: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--primary); margin-top:0;">🌙 作息挑戰 </h1>
    
    <div class="input-group">
        <label>正在為誰設定？</label>
        <select id="childName" onchange="runUpdateChart()">
            <option value="小佑">👦 小佑</option>
            <option value="媽媽">👧 媽媽</option>
        </select>
    </div>

    <div class="input-group">
        <label>目標就寢時間</label>
        <input type="time" id="bedtime" value="21:30" oninput="runCalculate()">
    </div>
    
    <div class="input-group">
        <label>今晚複習科目</label>
        <input type="text" id="subjects" placeholder="例如：數學、國文" oninput="runCalculate()">
    </div>

    <div id="result-display">讀取中...</div>
    <button onclick="runFinish()">我完成了！ 🎉</button>
</div>

<div class="chart-section">
    <h3 id="chart-title" style="text-align: center; color: #6c5ce7;">統計紀錄</h3>
    <canvas id="myChart"></canvas>
</div>

<script>
    const MY_PROJECT_URL = 'https://jcclynwwvcnjnjcorlqr.supabase.co'; 
    const MY_PROJECT_KEY = 'sb_publishable_hCm34wTgpGWyJkWKNApTEw_4Xu_f1Vq';
    let mySupabase;

    try {
        mySupabase = window.supabase.createClient(MY_PROJECT_URL, MY_PROJECT_KEY);
    } catch (e) { console.error(e); }

    window.onload = () => { runCalculate(); runUpdateChart(); };

    function runCalculate() {
        const bedtimeInput = document.getElementById('bedtime').value;
        const subjectsInput = document.getElementById('subjects').value;
        const displayDiv = document.getElementById('result-display');
        if (!bedtimeInput) return;
        const now = new Date();
        const [h, m] = bedtimeInput.split(':');
        const target = new Date();
        target.setHours(parseInt(h), parseInt(m), 0);
        if (target < now) target.setDate(target.getDate() + 1);
        let totalMin = Math.floor((target - now) / 60000);
        const fixed = 30;
        const buffer = Math.max(0, Math.floor((totalMin - fixed) * 0.15));
        const study = Math.max(0, totalMin - fixed - buffer);
        const subs = subjectsInput.split(/[,，、\s]+/).filter(s => s.trim() !== "");
        const perSub = Math.floor(study / (subs.length || 1));
        displayDiv.innerHTML = `🕒 距離就寢：${totalMin}分<br>🛡️ 緩衝時間：${buffer}分<br>📚 每個科目：約 ${perSub} 分鐘`;
    }

    async function runFinish() {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        const name = document.getElementById('childName').value;
        const bedtime = document.getElementById('bedtime').value;
        const subjects = document.getElementById('subjects').value;

        const { error } = await mySupabase.from('daily_plans').insert([
            { child_name: name, bedtime: bedtime, subjects: subjects, is_on_time: true }
        ]);

        if (error) alert("存檔失敗：" + error.message);
        else {
            alert(name + " 紀錄成功！你是最棒的！");
            runUpdateChart();
        }
    }

    let myChartInstance;
    async function runUpdateChart() {
        if (!mySupabase) return;
        const currentChild = document.getElementById('childName').value;
        document.getElementById('chart-title').innerText = currentChild + " 的達成次數";

        const { data, error } = await mySupabase
            .from('daily_plans')
            .select('*')
            .eq('child_name', currentChild)
            .order('created_at', { ascending: true })
            .limit(30);

        if (error || !data) return;

        const labels = data.map(d => (new Date(d.created_at).getMonth() + 1) + "/" + new Date(d.created_at).getDate());
        const successData = data.map(d => 1);
        const ctx = document.getElementById('myChart').getContext('2d');
        if (myChartInstance) myChartInstance.destroy();
        myChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{ label: '達成狀態', data: successData, backgroundColor: '#a29bfe' }]
            },
            options: { scales: { y: { beginAtZero: true, max: 1, ticks: { stepSize: 1 } } } }
        });
    }
</script>
</body>
</html>
