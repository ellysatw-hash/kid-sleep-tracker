<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小當家作戰總部</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .input-group { text-align: left; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 1px solid #dfe6e9; box-sizing: border-box; }
        #result-display { background: #f9f9ff; border-left: 5px solid var(--primary); padding: 15px; margin: 20px 0; border-radius: 8px; min-height: 50px; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌙 睡前大挑戰</h1>
    <div class="input-group">
        <label>目標就寢時間</label>
        <input type="time" id="bedtime" value="22:30" onchange="calculateBuffer()">
    </div>
    <div class="input-group">
        <label>今晚複習科目</label>
        <input type="text" id="subjects" placeholder="例如：數學、英文" oninput="calculateBuffer()">
    </div>
    <div id="result-display">計算中...</div>
    <button onclick="finishTask()">我準時完成了！ 🎉</button>
</div>

<div style="width: 100%; max-width: 450px; margin-top: 20px; background: white; padding: 20px; border-radius: 20px;">
    <canvas id="myChart"></canvas>
</div>

<script>
    // --- 請務必檢查這兩行 ---
    const SUPABASE_URL = 'https://jcclynwwvcnjnjcorlqr.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_hCm34wTgpGWyJkWKNApTEw_4Xu_f1Vq';

    let supabase;
    try {
        supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
        console.error("Supabase 初始化失敗，請檢查 URL 格式");
    }

    function calculateBuffer() {
        try {
            const bedtimeInput = document.getElementById('bedtime').value;
            const subjectsInput = document.getElementById('subjects').value;
            const displayDiv = document.getElementById('result-display');

            const now = new Date();
            const [h, m] = bedtimeInput.split(':');
            let target = new Date();
            target.setHours(h, m, 0);
            if (target < now) target.setDate(target.getDate() + 1);

            let diff = Math.floor((target - now) / 60000);
            let available = diff - 30; // 扣除雜務
            let buffer = Math.max(0, Math.floor(available * 0.15));
            let study = Math.max(0, available - buffer);
            
            let subs = subjectsInput.split(/[,，、\s]+/).filter(s => s.trim() !== "");
            let perSub = Math.floor(study / (subs.length || 1));

            displayDiv.innerHTML = `🕒 剩餘：${diff}分 | 🛡️ 緩衝：${buffer}分<br>📚 每個科目：${perSub}分`;
        } catch (err) {
            console.error(err);
        }
    }

    async function finishTask() {
        // 先噴紙屑，確保視覺回饋一定會跑
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

        if (!supabase) return alert("資料庫連線失敗");

        const { error } = await supabase.from('daily_plans').insert([
            { bedtime: document.getElementById('bedtime').value, subjects: document.getElementById('subjects').value, is_on_time: true }
        ]);

        if (error) alert("儲存成功但紙屑沒跑？不，是儲存失敗了：" + error.message);
        else {
            alert("太棒了！紀錄已儲存");
            updateChart();
        }
    }

    // 初始化執行
    calculateBuffer();
</script>
</body>
</html>
